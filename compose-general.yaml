name: m5d1-general

services:
  general-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: general_db
      POSTGRES_USER: general
      POSTGRES_PASSWORD: ${GENERAL_DB_PASSWORD:-general-practice-only}
    volumes:
      - general-data:/var/lib/postgresql/data
      - ./general/sql/posts.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U general -d general_db"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [general-data-net]

  general-api:
    build: ./general
    environment:
      DB_HOST: general-db
      DB_PORT: 5432
      DB_NAME: general_db
      DB_USER: general
      DB_PASSWORD: ${GENERAL_DB_PASSWORD:-general-practice-only}
      DB_SSLMODE: disable
      SECRET_KEY: ${GENERAL_SECRET_KEY:-general-practice-session-key-change-me}
      SESSION_COOKIE_SECURE: "false"
      MONITOR_URL: http://monitor-api:5000/api/events
      EVENT_TOKEN: ${EVENT_TOKEN:-local-practice-event-token}
    depends_on:
      general-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [general-front, general-data-net, m5d1-events]

  general-gateway:
    image: nginx:stable-alpine
    ports:
      - "8081:80"
    volumes:
      - ./gateways/general.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      general-api:
        condition: service_healthy
    networks: [general-front]

networks:
  general-front:
  general-data-net:
    internal: true
  m5d1-events:
    external: true
    name: m5d1-events

volumes:
  general-data:
