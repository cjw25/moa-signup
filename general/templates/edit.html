<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게시글 수정</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main><h1>게시글 수정 #{{ post[0] }}</h1>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><label for="title">제목</label><input id="title" name="title" value="{{ title }}"><label for="body">내용</label><textarea id="body" name="body" rows="10">{{ body }}</textarea><div class="actions"><button type="submit">수정 저장</button><a href="{{ url_for('board.detail', post_id=post[0]) }}">취소</a></div></form></main></body></html>
