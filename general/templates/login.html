<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게시판 로그인</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main><h1>게시판 로그인</h1><p>계정으로 로그인하면 게시글을 볼 수 있습니다.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post"><label for="username">아이디</label><input id="username" name="username" value="{{ username or '' }}" required><label for="password">비밀번호</label><input id="password" name="password" type="password" required><button type="submit">로그인</button></form>
</main></body></html>
