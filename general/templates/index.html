<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게시글 목록</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main><header><h1>나만의 게시판</h1><a class="button" href="{{ url_for('board.new') }}">새 글 작성</a></header>{% if posts %}<ul class="posts">{% for post in posts %}<li><span>#{{ post[0] }}</span><a href="{{ url_for('board.detail', post_id=post[0]) }}">{{ post[1] }}</a></li>{% endfor %}</ul>{% else %}<p>등록된 게시글이 없습니다.</p>{% endif %}</main></body></html>
