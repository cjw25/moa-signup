name: m5d1-monitor

services:
  monitor-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitor_db
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${MONITOR_DB_PASSWORD:-monitor-practice-only}
    volumes:
      - monitor-data:/var/lib/postgresql/data
      - ./monitor/backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor_db"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [monitor-data-net]

  monitor-api:
    build: ./monitor/backend
    environment:
      DB_HOST: monitor-db
      DB_PORT: 5432
      DB_NAME: monitor_db
      DB_USER: monitor
      DB_PASSWORD: ${MONITOR_DB_PASSWORD:-monitor-practice-only}
      DB_SSLMODE: disable
      SECRET_KEY: ${MONITOR_SECRET_KEY:-monitor-practice-session-key-change-me}
      SESSION_COOKIE_SECURE: "false"
      EVENT_TOKEN: ${EVENT_TOKEN:-local-practice-event-token}
    depends_on:
      monitor-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [monitor-front, monitor-data-net, m5d1-events]

  monitor-web:
    build: ./monitor/next-frontend
    environment:
      MONITOR_API_URL: http://monitor-api:5000
    depends_on:
      monitor-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [monitor-front]

  monitor-gateway:
    image: nginx:stable-alpine
    ports:
      - "8082:80"
    volumes:
      - ./gateways/monitor.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      monitor-api:
        condition: service_healthy
      monitor-web:
        condition: service_healthy
    networks: [monitor-front]

networks:
  monitor-front:
  monitor-data-net:
    internal: true
  m5d1-events:
    external: true
    name: m5d1-events

volumes:
  monitor-data:
